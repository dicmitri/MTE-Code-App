         Platforms fall back to the URL actually shared, which is correct here. -->

    <meta property="og:site_name" content="MedTech Europe: The Code App" />
    <meta property="og:title" content="MedTech Europe Code of Ethical Business Practice" />
    <meta property="og:description" content="The full Code of Ethical Business Practice, Disclosure Guidelines, decision trees and compliance tools." />
    <meta property="og:image" content="https://medtecheurope-code.org/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MedTech Europe Code of Ethical Business Practice" />
    <meta name="twitter:description" content="The full Code of Ethical Business Practice, Disclosure Guidelines, decision trees and compliance tools." />
    <meta name="twitter:image" content="https://medtecheurope-code.org/logo.png" />
